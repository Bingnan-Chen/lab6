<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact the Dance Club | KJHDC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">KJHDC</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
        data-bs-target="#site-menu" aria-controls="site-menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" id="site-menu" aria-labelledby="menu-title">
        <div class="drawer-header">
          <p class="drawer-title" id="menu-title">Menu</p>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close menu"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#activities">Activities</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
  <main class="container py-4">
    <h1>Contact KJHDC</h1>
    <p>Have a question about joining, workshops or performances? Tell us what you would like to know.</p>
    <form method="get" action="contact.html">
      <div class="row g-4">
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-control" type="text" id="first-name" autocomplete="given-name" required>
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-control" type="text" id="last-name" autocomplete="family-name" required>
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" autocomplete="email" placeholder="name@example.com" required>
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="topic">Topic</label>
            <select class="form-control" id="topic" required>
              <option value="">Choose a topic</option>
              <option value="joining">Joining the club</option>
              <option value="workshops">Workshops and rehearsals</option>
              <option value="showcase">Performances and showcase</option>
            </select>
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" rows="4" required></textarea>
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="form-field">
            <input class="check" type="checkbox" id="consent" required>
            <label for="consent">I agree to be contacted about my message.</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-solid theme-primary mt-4">Submit</button>
      <p class="mt-3">This form does not send messages.</p>
    </form>
  </main>
  <footer class="bg-1 py-4">
    <div class="container">K-pop Jazz Hip-hop Dance Club · University of Toronto Mississauga</div>
  </footer>
</body>
</html>
