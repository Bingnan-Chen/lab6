<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dance at UTM | KJHDC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">KJHDC</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
        data-bs-target="#site-menu" aria-controls="site-menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" id="site-menu" aria-labelledby="menu-title">
        <div class="drawer-header">
          <p class="drawer-title" id="menu-title">Menu</p>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close menu"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#activities">Activities</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
  <main class="container py-4">
    <h1>K-pop Jazz Hip-hop Dance Club</h1>
    <p>Explore dance workshops, team rehearsals and performances at UTM.</p>
    <div class="carousel carousel-overlay" id="dance-carousel" aria-label="KJHDC photo highlights">
      <div class="carousel-inner rounded-5">
        <div class="carousel-item active">
          <img class="d-block w-100" src="images/slide-1.jpg" alt="Dancers in white costumes performing under purple stage lights">
        </div>
        <div class="carousel-item">
          <img class="d-block w-100" src="images/slide-2.jpg" alt="Dancers rehearsing choreography in a studio with a wooden floor">
        </div>
        <div class="carousel-item">
          <img class="d-block w-100" src="images/slide-3.jpg" alt="Showcase performers posing together in several rows onstage">
        </div>
      </div>
      <div class="carousel-overlay-controls">
        <button type="button" class="btn-icon btn-sm btn-subtle theme-secondary"
          data-bs-target="#dance-carousel" data-bs-slide="prev">
          <span class="carousel-icon-prev" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button type="button" class="btn-icon btn-sm btn-subtle theme-secondary"
          data-bs-target="#dance-carousel" data-bs-slide="next">
          <span class="carousel-icon-next" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </main>
  <footer class="bg-1 py-4">
    <div class="container">K-pop Jazz Hip-hop Dance Club · University of Toronto Mississauga</div>
  </footer>
</body>
</html>
